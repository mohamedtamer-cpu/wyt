<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WYT Admin Panel</title>
  <link rel="icon" href="/images/logo.jpeg" type="image/jpeg">
  <link rel="stylesheet" href="/admin.css">
</head>
<body>
  <aside class="sidebar">
    <a href="/" aria-label="WYT home"><img class="admin-logo" src="/images/logo.jpeg" alt="WYT"></a>
    <h2>WYT Admin</h2>
    <nav id="sections" aria-label="Content sections"></nav>
    <a href="/" target="_blank" rel="noopener">View website ↗</a>
    <button id="logout" class="btn" hidden>Log out</button>
  </aside>
  <main class="main">
    <p id="notice" role="status" aria-live="polite"></p>
    <section id="login" class="card">
      <h1>Welcome back</h1>
      <p>Enter your admin password to manage the website.</p>
      <form id="login-form">
        <div class="form-group"><label for="password">Admin password</label><input id="password" type="password" class="form-control" autocomplete="current-password" required></div>
        <button class="btn">Log in</button>
      </form>
    </section>
    <div id="workspace" hidden>
      <section class="card" id="editor"><h1 id="editor-title"></h1><form id="content-form"><div id="fields"></div><button class="btn" id="save">Save</button></form></section>
      <section class="card"><h2 id="list-title"></h2><div class="table-wrap"><table><thead id="list-head"></thead><tbody id="content-list"></tbody></table></div></section>
    </div>
  </main>
  <script src="/admin.js"></script>
</body>
</html>
