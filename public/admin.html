<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>WYT Admin Panel</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>

  <div class="sidebar">
    <h2>WYT Admin</h2>
    <a href="#" class="active">Machines</a>
  </div>

  <div class="main">
    <div class="card">
      <h3>Add New Machine</h3>
      <form id="m-form" onsubmit="event.preventDefault(); addMachine();">
        <div class="form-group">
          <label>Machine Name</label>
          <input type="text" id="m-name" class="form-control" required />
        </div>
        <div class="form-group">
          <label>Badge (Optional)</label>
          <input type="text" id="m-badge" class="form-control" placeholder="e.g. Popular" />
        </div>
        <div class="form-group">
          <label>Description</label>
          <textarea id="m-desc" class="form-control"></textarea>
        </div>
        <div class="form-group">
          <label>Machine Photo</label>
          <div class="image-picker" onclick="document.getElementById('img-input').click();">
            <span>Click to select an image file</span>
            <input type="file" id="img-input" accept="image/*" style="display:none;" />
            <img id="img-preview" src="" style="display:none;" />
          </div>
        </div>
        <div class="form-group">
          <label>Specifications (One per line: Label | Value)</label>
          <textarea id="m-specs" class="form-control" placeholder="Dimensions | 180 x 90 x 80 cm&#10;Capacity | 60 slots"></textarea>
        </div>
        <button type="submit" class="btn">Add Machine</button>
      </form>
    </div>

    <div class="card">
      <h3>All Machines</h3>
      <table>
        <thead>
          <tr>
            <th>Photo</th>
            <th>Name</th>
            <th>Badge</th>
            <th>Description</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="machines-list"></tbody>
      </table>
    </div>
  </div>

  <script src="admin.js"></script>
</body>
</html>
